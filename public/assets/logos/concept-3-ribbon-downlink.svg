<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Skyc Logo Concept 3: The Swiss Geometric Ribbon & Downlink -->
  <defs>
    <clipPath id="vault-cut">
      <rect x="0" y="0" width="256" height="256" rx="40" />
    </clipPath>
  </defs>

  <!-- Upper Sky Collector Loop (Terracotta) -->
  <path d="M 180 84 
           H 116 
           C 90 84 68 106 68 132 
           C 68 158 90 180 116 180 
           H 188" 
        stroke="#D97757" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Diagonal Intersecting Spine (Deep Obsidian) -->
  <path d="M 76 68 
           L 180 172 
           V 196 
           C 180 208 170 218 158 218 
           H 84" 
        stroke="#191918" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Downlink Directional Arrow in Negative Space -->
  <path d="M 128 44 L 128 88 M 114 74 L 128 88 L 142 74" 
        stroke="#D97757" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
