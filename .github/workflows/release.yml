name: Build & Release Skyc (Android & Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Install dependencies & compile scrapers
        run: |
          npm install
          npm run build:scrapers
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Skyc-v1.0.0.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Skyc-v1.0.0.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Desktop (NSIS & MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies & build Windows installer
        run: |
          npm install
          npm run windows:build

      - name: Prepare Windows Installers
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path src-tauri/target -Recurse -Filter "*setup.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "Skyc_1.0.0_x64-setup.exe"
            Copy-Item $nsis.FullName "Skyc_1.0.0_Windows_Setup.exe"
          }
          $msi = Get-ChildItem -Path src-tauri/target -Recurse -Filter "*.msi" | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "Skyc_1.0.0_x64_en-US.msi"
            Copy-Item $msi.FullName "Skyc_1.0.0_Windows.msi"
          }

      - name: Upload Windows Installers to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Skyc_1.0.0_x64-setup.exe
            Skyc_1.0.0_Windows_Setup.exe
            Skyc_1.0.0_x64_en-US.msi
            Skyc_1.0.0_Windows.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
